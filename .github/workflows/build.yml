name: Desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            args: --mac --arm64 --x64
          - os: windows-latest
            target: windows
            args: --win --x64
          - os: ubuntu-latest
            target: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version)"
      - run: npm ci
      - run: npm test
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        run: npm run test:app
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:app
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Still-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots-${{ matrix.target }}
          path: artifacts/*.png

  release:
    name: Publish app downloads
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Still-*
          merge-multiple: true
          path: installers
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          installers/*.dmg installers/*.zip installers/*.exe installers/*.AppImage
          --verify-tag --generate-notes --title "Still ${GITHUB_REF_NAME#v}"
